name: Compilar APK Parlante Cobros

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar repositorio
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Generar Wrapper
      run: |
        gradle wrapper --gradle-version 8.2
        chmod +x gradlew

    - name: Compilar APK Debug
      run: ./gradlew assembleDebug --stacktrace

    - name: Subir APK como Artefacto
      uses: actions/upload-artifact@v4
      with:
        name: ParlanteCobros-APK
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Publicar Release para descarga directa en Celular
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.2.0
        name: "Punk v1.2.0 - Corrección de Preferencias, Audio Multimedia y Filtro Antispam"
        body: |
          ### Punk v1.2.0 - Actualización de Estabilidad y Cumplimiento Play Store

          - **Interruptores de Configuración 100% Funcionales y Persistentes:** Guardado permanente en SharedPreferences para 'Mencionar nombre de quien paga' y 'Campanilla previa (Chime)', reflejándose de inmediato en la voz de prueba y en cobros reales.
          - **Canal de Audio Multimedia (STREAM_MUSIC):** El volumen ahora se controla directamente desde los botones físicos laterales del teléfono. Se eliminó el bloqueo forzado de volumen al 85%.
          - **Control Deslizante de Volumen en Ajustes:** Nuevo selector de volumen de alerta de voz integrado en el panel de configuración.
          - **Filtro Estricto Antispam Financiero:** Bloqueo automático de promociones de Yape/Plin (como "Gana 50 soles con Yape Hijos", préstamos, sorteos, etc.) para evitar falsos cobros. Se requiere confirmación positiva de abono recibido.
          - **Cumplimiento de Políticas Google Play:** Enlace directo a las Políticas de Privacidad oficiales desplegadas en la web.

          **Para instalar en tu celular Android:**
          1. Descarga el archivo `app-debug.apk`.
          2. Presiona **Actualizar/Instalar**.
        files: app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
