name: Compilar APK Parlante Cobros

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar repositorio
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Generar Wrapper
      run: |
        gradle wrapper --gradle-version 8.2
        chmod +x gradlew

    - name: Compilar APK Debug
      run: ./gradlew assembleDebug --stacktrace

    - name: Subir APK como Artefacto
      uses: actions/upload-artifact@v4
      with:
        name: ParlanteCobros-APK
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Publicar Release para descarga directa en Celular
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.2.3
        name: "Punk v1.2.3 - Identidad Vexum, Historial Persistente y Watchdog 24/7"
        body: |
          ### Punk v1.2.3 - Arquitectura Google Play `com.vexum.punk` & Supervivencia 24/7

          - **Identidad Oficial Google Play:** Paquete actualizado oficialmente a `com.vexum.punk` con autoría e identidad corporativa de Vexum.
          - **Supervivencia y Watchdog 24/7:** Servicio con reconexión indestructible contra el modo reposo/Doze de Android, receptor de reinicio del dispositivo (`BOOT_COMPLETED`, `USER_PRESENT`, `SCREEN_ON`) y ciclo de vigilancia cada 10 minutos para que nunca se apague tras horas o días de uso.
          - **Historial Persistente con Auto-Limpieza (30 días):** Los cobros ahora se almacenan de forma segura en la memoria interna local del teléfono. Se eliminó el botón accidental de 'Limpiar' y se implementó una purga automática a los 30 días para no consumir almacenamiento.
          - **Filtros por Período y Agrupación por Fecha:** Vistas segmentadas de 'Hoy', 'Esta Semana' y 'Este Mes' en caja y analítica, con agrupación visual estilo Apple (Hoy, Ayer, fecha).
          - **Analítica de Franjas Simplificada:** Clasificación en 3 turnos: 'Día', 'Tarde' y 'Noche' (con horarios delimitados en código sin recargar la interfaz).
          - **Ajustes Rediseñados Estilo Apple:** Secciones agrupadas Inset Grouped, controles unificados y pie de página ejecutivo 'Desarrollado por Vexum'.

          **Para instalar en tu celular Android:**
          1. Descarga el archivo `app-debug.apk`.
          2. Presiona **Actualizar/Instalar**.
        files: app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
