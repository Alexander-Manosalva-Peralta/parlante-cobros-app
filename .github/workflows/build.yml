name: Compilar APK y AAB Punk Cobros

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar repositorio
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Generar Wrapper
      run: |
        gradle wrapper --gradle-version 8.2
        chmod +x gradlew

    - name: Compilar APK Debug y AAB Release
      run: |
        ./gradlew assembleDebug bundleRelease --stacktrace --no-daemon 2>&1 | tee build.log
        STATUS=${PIPESTATUS[0]}
        if [ $STATUS -ne 0 ]; then
          echo "=== GRADLE FAILURE DETECTED ==="
          grep -E "e: |FAILURE:|Caused by:" build.log | head -n 30 | while IFS= read -r line; do
            echo "::error::$line"
          done

          # Publicar log completo en la rama build-logs para inspección inmediata
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout -B build-logs
          git add -f build.log
          git commit -m "chore: debug build log"
          git push -f origin build-logs || true

          exit $STATUS
        fi

    - name: Subir Log de Compilación en caso de Fallo
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: gradle-failure-log
        path: build.log

    - name: Subir APK Debug como Artefacto
      uses: actions/upload-artifact@v4
      with:
        name: Punk-APK-Debug
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Subir AAB Release como Artefacto (para Google Play)
      uses: actions/upload-artifact@v4
      with:
        name: Punk-AAB-PlayStore
        path: app/build/outputs/bundle/release/app-release.aab

    - name: Publicar Release para descarga directa en Celular
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.2.3
        name: "Punk v1.2.3 - Identidad Vexum, Historial Persistente y Watchdog 24/7"
        body: |
          ### Punk v1.2.3 - Arquitectura Google Play `com.vexum.punk` & Supervivencia 24/7

          - **Identidad Oficial Google Play:** Paquete actualizado oficialmente a `com.vexum.punk` con autoría e identidad corporativa de Vexum.
          - **Supervivencia y Watchdog 24/7:** Servicio con reconexión indestructible contra el modo reposo/Doze de Android.
          - **Historial Persistente con Auto-Limpieza (30 días):** Cobros guardados localmente con purga automática.
          - **Filtros por Período:** Vistas de Hoy, Esta Semana y Este Mes con agrupación por fecha.
          - **Analítica de Franjas:** Clasificación en Día, Tarde y Noche.
          - **Ajustes Rediseñados Estilo Apple:** Inset Grouped con pie ejecutivo "Desarrollado por Vexum".

          **Para instalar en tu celular Android:**
          1. Descarga el archivo `app-debug.apk`.
          2. Presiona **Actualizar/Instalar**.

          **Para Google Play Store:**
          Descarga `app-release.aab` y súbelo en Play Console → Prueba interna.
        files: |
          app/build/outputs/apk/debug/app-debug.apk
          app/build/outputs/bundle/release/app-release.aab
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

