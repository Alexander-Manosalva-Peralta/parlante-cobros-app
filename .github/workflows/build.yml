name: Compilar APK Parlante Cobros

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar repositorio
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Generar Wrapper
      run: |
        gradle wrapper --gradle-version 8.2
        chmod +x gradlew

    - name: Compilar APK Debug
      run: ./gradlew assembleDebug --stacktrace

    - name: Subir APK como Artefacto
      uses: actions/upload-artifact@v4
      with:
        name: ParlanteCobros-APK
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Publicar Release para descarga directa en Celular
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.1.3
        name: "Punk v1.1.3 (Diseño Oficial Completo con Imagen Integrada)"
        body: |
          ### Punk v1.1.3 - Versión Oficial con Imagen Integrada

          - **Diseño Completo Integrado:** Fondo arquitectónico oficial de alta fidelidad con tipografía, logotipo Punk, contrastes y elementos visuales originales sin textos duplicados ni superposiciones.
          - **Formulario Transparente y Limpio:** Campos de correo y contraseña alineados con precisión bajo el título integrado.
          - **Botón de Ingreso Píldora de Alto Contraste:** Acceso rápido con estado de carga y soporte directo de autenticación en tiempo real con Supabase y Vercel.
          - **Protección Anti-Piratería (Device Locking):** Vinculación segura de cuenta y licencia vitalicia por dispositivo.

          **Para instalar en tu celular Android:**
          1. Descarga el archivo `app-debug.apk`.
          2. Presiona **Actualizar/Instalar**.
        files: app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
