name: Compilar APK Parlante Cobros

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar repositorio
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Generar Wrapper
      run: |
        gradle wrapper --gradle-version 8.2
        chmod +x gradlew

    - name: Compilar APK Debug
      run: ./gradlew assembleDebug --stacktrace

    - name: Subir APK como Artefacto
      uses: actions/upload-artifact@v4
      with:
        name: ParlanteCobros-APK
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Publicar Release para descarga directa en Celular
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.6
        name: "punk v1.0.6 (Logo Oficial, Voz Natural y Cero Emojis)"
        body: |
          ### punk v1.0.6 - Logo Oficial, Voz Natural y Cero Emojis
          
          - **Logo Oficial:** Integrado el logotipo oficial "punk" tanto en el icono de la aplicación como en la cabecera.
          - **Voz Humana y Natural:** Algoritmo de selección de voces neuronales / WaveNet de Google con cadencia humana, pronunciación nativa de soles y pausas naturales.
          - **Diseño Sobrio y Profesional:** Eliminación total de emojis en toda la interfaz para un acabado de nivel corporativo.
          - **Módulo BI:** Métricas en tiempo real, ticket promedio, horas pico y desglose por billetera.
          
          **Para instalar en tu celular Android:**
          1. Descarga el archivo `app-debug.apk`.
          2. Presiona **Actualizar/Instalar**.
        files: app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
