name: Compilar APK Parlante Cobros

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar repositorio
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Generar Wrapper
      run: |
        gradle wrapper --gradle-version 8.2
        chmod +x gradlew

    - name: Compilar APK Debug
      run: ./gradlew assembleDebug --stacktrace

    - name: Subir APK como Artefacto
      uses: actions/upload-artifact@v4
      with:
        name: ParlanteCobros-APK
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Publicar Release para descarga directa en Celular
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.4
        name: "Parlante Cobros v1.0.4 (Rediseño Visual Sofisticado Neo-Fintech)"
        body: |
          ### Versión 1.0.4 - Nuevo Diseño Sofisticado & Profesional 🌟
          
          - **Nueva Interfaz Neo-Fintech:** Tarjeta Hero Obsidian de alta gama, tipografía premium y tarjetas redondeadas con bordes sutiles.
          - **Controles Bento:** Ajustes rápidos de voz, campanilla y cliente en squircles táctiles.
          - **Billeteras Vinculadas:** Carrusel moderno con estado en vivo para Yape, Plin y bancos.
          - **Eliminación de Elementos de Prueba:** Interfaz 100% limpia para producción.
          
          **Para instalar en tu celular Android:**
          1. Descarga el archivo `app-debug.apk`.
          2. Presiona **Actualizar/Instalar**.
        files: app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
