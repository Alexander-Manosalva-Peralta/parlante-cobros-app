name: Compilar APK Parlante Cobros

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar repositorio
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Generar Wrapper
      run: |
        gradle wrapper --gradle-version 8.2
        chmod +x gradlew

    - name: Compilar APK Debug
      run: ./gradlew assembleDebug --stacktrace

    - name: Subir APK como Artefacto
      uses: actions/upload-artifact@v4
      with:
        name: ParlanteCobros-APK
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Publicar Release para descarga directa en Celular
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.7
        name: "punk v1.0.7 (Pantalla Apagada 24/7 y Concurrencia Rápida Bancaria)"
        body: |
          ### punk v1.0.7 - Funcionamiento con Pantalla Apagada & Alta Concurrencia
          
          - **Pantalla Apagada 24/7:** Servicio permanente en primer plano (`PunkKeepAliveService`) y audio enrutado por canal de alarma (`USAGE_ALARM` + WakeLock). Funciona con el celular bloqueado y fuera de la app.
          - **Algoritmo de Concurrencia Bancaria:** Maneja depósitos seguidos en ráfaga (ej. 3 Yapes en segundos). Cada cobro es registrado individualmente sin perder transacciones.
          - **Cola de Voz Secuencial (`QUEUE_ADD`):** Si llegan varios cobros seguidos, el altavoz los anuncia uno tras otro en orden sin cortarse.
          - **Auto-Reconexión:** Si el sistema operativo intenta desvincular el servicio en segundo plano, se reconecta automáticamente al instante.
          
          **Para instalar en tu celular Android:**
          1. Descarga el archivo `app-debug.apk`.
          2. Presiona **Actualizar/Instalar**.
        files: app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
