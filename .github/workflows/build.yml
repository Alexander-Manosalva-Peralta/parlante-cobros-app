name: Compilar APK Parlante Cobros

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar repositorio
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Generar Wrapper
      run: |
        gradle wrapper --gradle-version 8.2
        chmod +x gradlew

    - name: Compilar APK Debug
      run: ./gradlew assembleDebug --stacktrace

    - name: Subir APK como Artefacto
      uses: actions/upload-artifact@v4
      with:
        name: ParlanteCobros-APK
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Publicar Release para descarga directa en Celular
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.2.2
        name: "Punk v1.2.2 - Restauración y Optimización Bancaria de Cobros Yape y Plin"
        body: |
          ### Punk v1.2.2 - Detección Concurrente y Filtro Financiero de Alta Precisión

          - **Restauración Total de Pagos Yape:** Se reactivó la compatibilidad y captura para todas las notificaciones entrantes de Yape (`com.bcp.innovacxion.yapeapp`). Ahora cada yapeo recibido se detecta, registra inmediatamente en caja e interactúa con el sintetizador de voz.
          - **Filtro Selectivo Antispam y Antipromociones:** Se corrigió el filtro de marketing para bloquear exclusivamente promociones (como 'Gana 50 soles con Yape Hijos', préstamos, créditos o sorteos) sin afectar las notas de pago de clientes que contengan términos de comercio como compras o recargas.
          - **Reconocimiento Robusto de Montos y Remitentes:** Soporte para transferencias con o sin céntimos, montos mayores a mil soles con separador de miles, y captura afinada del nombre de cliente o pagador.
          - **Estética y Ajustes Preservados:** Indicador discreto 'Audio POS Activo', diseño de perfil de comercio sin deformaciones, y persistencia de interruptores de volumen y sonido.

          **Para instalar en tu celular Android:**
          1. Descarga el archivo `app-debug.apk`.
          2. Presiona **Actualizar/Instalar**.
        files: app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
