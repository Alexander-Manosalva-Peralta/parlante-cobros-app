name: Compilar APK Parlante Cobros

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar repositorio
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Generar Wrapper
      run: |
        gradle wrapper --gradle-version 8.2
        chmod +x gradlew

    - name: Compilar APK Debug
      run: ./gradlew assembleDebug --stacktrace

    - name: Subir APK como Artefacto
      uses: actions/upload-artifact@v4
      with:
        name: ParlanteCobros-APK
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Publicar Release para descarga directa en Celular
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.5
        name: "punk v1.0.5 (Nuevo Logo, Saludo Inteligente y Módulo BI)"
        body: |
          ### punk v1.0.5 - Inteligencia de Negocio & Nueva Identidad ⚡
          
          - **Nueva Identidad "punk":** Nombre renovado y nuevo isotipo geométrico de lujo.
          - **Módulo BI (Business Intelligence):** Ticket promedio, horario pico de ventas, gráfico de barras y participación por billetera.
          - **Saludo Dinámico:** Saludo adaptado según la hora local (Buenos días, Buenas tardes, Buenas noches).
          - **Dock Flotante:** Barra de navegación inferior entre Caja, BI Métricas y Ajustes.
          
          **Para instalar en tu celular Android:**
          1. Descarga el archivo `app-debug.apk`.
          2. Presiona **Actualizar/Instalar**.
        files: app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
