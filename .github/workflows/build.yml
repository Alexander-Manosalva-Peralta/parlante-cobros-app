name: Compilar APK Parlante Cobros

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar repositorio
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Generar Wrapper
      run: |
        gradle wrapper --gradle-version 8.2
        chmod +x gradlew

    - name: Compilar APK Debug
      run: ./gradlew assembleDebug --stacktrace

    - name: Subir APK como Artefacto
      uses: actions/upload-artifact@v4
      with:
        name: ParlanteCobros-APK
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Publicar Release para descarga directa en Celular
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.2.1
        name: "Punk v1.2.1 - Rediseño Ejecutivo de Perfil y Estado Minimalista"
        body: |
          ### Punk v1.2.1 - Refinamiento Estético y Seguridad de Plataforma

          - **Indicador de Estado Ejecutivo y Discreto:** Se reemplazó la etiqueta verde por un distintivo minimalista 'Audio POS Activo' con estética fintech neutral de alto contraste.
          - **Tarjeta de Comercio Autorizado Reestructurada:** Eliminada la etiqueta deformada de días de licencia. Ahora cuenta con icono de tienda, nombre de negocio espacioso y botón de salir alineado con elegancia.
          - **Seguridad y Privacidad Web:** Panel administrativo protegido con acceso maestro exclusivo y eliminación de enlaces públicos al dashboard en las políticas de privacidad.
          - **Persistencia de Configuración y Filtro Antispam:** Todas las mejoras de volumen multimedia, interruptores de voz y bloqueo de promociones bancarias integradas.

          **Para instalar en tu celular Android:**
          1. Descarga el archivo `app-debug.apk`.
          2. Presiona **Actualizar/Instalar**.
        files: app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
