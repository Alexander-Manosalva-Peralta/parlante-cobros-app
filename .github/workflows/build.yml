name: Compilar APK Parlante Cobros

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar repositorio
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Generar Wrapper
      run: |
        gradle wrapper --gradle-version 8.2
        chmod +x gradlew

    - name: Compilar APK Debug
      run: ./gradlew assembleDebug --stacktrace

    - name: Subir APK como Artefacto
      uses: actions/upload-artifact@v4
      with:
        name: ParlanteCobros-APK
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Publicar Release para descarga directa en Celular
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.1.2
        name: "Punk v1.1.2 (Rediseño Editorial Brutalista & Estética Apple)"
        body: |
          ### Punk v1.1.2 - Rediseño Oficial de Inicio de Sesión
          
          - **Rediseño Editorial Brutalista Apple:** Pantalla de Login completamente rediseñada con la fotografía arquitectónica brutalista de fondo, composición tipográfica de alto impacto ("Iniciar" Sans Bold + "Sesión" Serif Italic en champagne/crema), logotipo oficial blanco translúcido en cabecera y estética minimalista contemporánea.
          - **Tarjetas de Entrada Translúcidas:** Campos de correo y contraseña con contenedores oscuros translúcidos, iconos delineados minimalistas y divisores discretos.
          - **Botón Píldora de Alto Contraste:** Botón principal de acceso en tono marfil/hueso ("Ingresar a Punk") con indicador de flecha y estado de carga integrado.
          - **Validación en Tiempo Real con Supabase & Vercel:** Conserva al 100% la autenticación contra tu base de datos en tiempo real, bloqueo de piratería por dispositivo (Device Locking) y soporte de licencias vitalicias.
          
          **Para instalar en tu celular Android:**
          1. Descarga el archivo `app-debug.apk`.
          2. Presiona **Actualizar/Instalar**.
        files: app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
